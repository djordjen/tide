name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # The optional Qt suite needs system Qt libraries here; it runs on
            # the Windows job, whose PySide6 wheels are self-contained.
            extras: --extra dev
          - os: windows-latest
            extras: --extra dev --extra gui

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked ${{ matrix.extras }}
      # The Qt suite uses importorskip, so a missing PySide6 would leave it
      # silently unrun -- which is exactly how it stopped running here before.
      - run: uv run python -c "import PySide6"
        if: matrix.os == 'windows-latest'
      - run: uv run python -m pytest --cov --cov-report=term-missing
      - run: uv run ruff check src tests applications/invoicing/actions.py
      - run: uv run mypy
      - run: uv run tide model validate applications/invoicing
      - run: uv run python -m build
        if: matrix.os == 'ubuntu-latest'

  web:
    name: Web / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `check` is the single local gate: tsc, eslint, then the unit tests.
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
