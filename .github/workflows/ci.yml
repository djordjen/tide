name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One environment for both platforms. The jobs used to differ because
        # the Qt suite needed PySide6 wheels that only the Windows runner could
        # install without system Qt libraries; with that renderer retired there
        # is no reason for the two to run different sets of tests, and a run
        # that reports two different counts is a run nobody can read.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      # Four workers, pinned rather than `auto`: the Textual and Studio suites
      # drive real terminal pilots with real timeouts, and oversubscribing a
      # runner makes them miss waits rather than fail honestly -- the same
      # reason `web/vite.config.ts` caps its jsdom pool. `loadfile` keeps each
      # file on one worker, so nothing has to stop assuming its own ordering.
      # Measured at 1.96x with coverage; four repeat runs found no flakes.
      - run: uv run python -m pytest --cov --cov-report=term-missing -n 4 --dist loadfile
      # The repository, not a hand-maintained list of directories. The list
      # named files first -- and the second application arrived with four
      # unlinted ones because it said `applications/invoicing/actions.py`. It
      # then named directories, and `tools/` and `examples/` arrived unlinted
      # for the same reason. Ruff honours `.gitignore`, so `.` is every Python
      # file this repository actually owns.
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run tide model validate applications/invoicing
      - run: uv run tide model validate applications/contacts
      - run: uv run python -m build
        if: matrix.os == 'ubuntu-latest'

  web:
    name: Web / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The journeys drive the renderer against a real TIDE server hosting the
      # built bundle, so this job needs the Python side too.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      # `spreadsheet` too, so the journeys meet the same export
      # controls a developer does: without it the manifest offers
      # CSV alone and the toolbar renders a different control.
      - run: uv sync --locked --extra api --extra report --extra spreadsheet
        working-directory: .
      - run: npm ci
      # `check` is the single local gate: tsc, eslint, then the unit tests.
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
