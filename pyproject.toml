[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tide-framework"
version = "0.1.0"
description = "Terminal Integrated Data Environment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
    "ruamel.yaml>=0.18.10,<0.19",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
migration = [
    "alembic>=1.18.5,<2",
]
tui = [
    "textual>=8.2,<9",
]
studio = [
    "textual[syntax]>=8.2,<9",
]
sqlserver = [
    "pyodbc>=5.3,<6",
]
seed = [
    "Faker>=37.4,<38",
]
report = [
    "reportlab>=4.4,<5",
]
spreadsheet = [
    "openpyxl>=3.1,<4",
]
api = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]
client = [
    "httpx>=0.28,<1",
]
mcp = [
    "mcp>=1.28,<2",
]
auth = [
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
]
dev = [
    "alembic>=1.18.5,<2",
    "build>=1.2,<1.5.1",
    "fastapi>=0.116,<1",
    "Faker>=37.4,<38",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "mcp>=1.28,<2",
    "mypy>=1.18,<2",
    "openpyxl>=3.1,<4",
    "PyJWT[crypto]>=2.10,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6.0,<8",
    "pytest-xdist>=3.6,<4",
    "reportlab>=4.4,<5",
    "ruff>=0.15,<1",
    "textual[syntax]>=8.2,<9",
    "types-PyYAML>=6.0,<7",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
tide = "tide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tide"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "sqlserver: requires an explicitly configured SQL Server integration database",
]

[tool.coverage.run]
source = ["tide"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/tide"]
ignore_missing_imports = true

# Modules that already type-check are gated, so new code and new modules cannot
# regress. The list below predates type checking in CI and is a backlog, not a
# policy: remove an entry once its module is clean, and never add one.
[[tool.mypy.overrides]]
module = [
    "tide.api.browser_auth",
    "tide.api.client",
    "tide.api.contracts",
    "tide.api.inputs",
    "tide.api.openapi",
    "tide.api.presentation",
    "tide.api.server",
    "tide.api.wire",
    "tide.compiler.compiler",
    "tide.data.memory",
    "tide.data.migrations",
    "tide.data.revisions",
    "tide.data.sql_expressions",
    "tide.data.sqlalchemy",
    "tide.development.designer",
    "tide.development.designer_transaction",
    "tide.development.materialization",
    "tide.mcp.contracts",
    "tide.mcp.runtime",
    "tide.reporting.service",
    "tide.tui.app",
    "tide.tui.audit",
    "tide.tui.form",
    "tide.tui.report",
    "tide.tui.table",
]
ignore_errors = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than inherited from ruff's defaults: the default
# rule set changes between ruff releases, which turns a routine tool upgrade
# into a CI outage on unchanged code. Adopting further rules is a deliberate
# edit here.
select = ["E4", "E7", "E9", "F", "B023"]
# B023 is here because a closure that reads a loop variable reads whichever
# value the loop reached last, and this runtime builds per-entity and per-field
# callables in loops -- a miscapture would silently bind the wrong entity and
# raise nothing. All 29 findings at adoption were within-iteration and safe;
# they were restructured rather than suppressed, so the rule is now free to
# mean what it says.
