schema_version: "0.1"
reference_application: applications/invoicing

renderers:
  tui:
    label: Textual TUI
  web:
    label: React Web

reference_contract:
  # The role every renderer resolves this contract as. Recorded here rather
  # than defaulted in the harness: a default is an Invoicing role that a second
  # application does not define, and the resulting failure reads as an empty
  # capability set rather than as a missing setting.
  role: sales_clerk
  navigation:
    - label: Sales
      views: [sales.Invoice.browse]
    - label: Master Data
      views: [crm.Customer.browse, catalog.Product.browse]
  browse:
    sales.Invoice.browse:
      columns: [number, invoice_date, customer, status, total]
      alignments:
        number: left
        invoice_date: left
        customer: left
        status: left
        total: right
      summaries:
        number: count
        total: sum
  forms:
    sales.Invoice.edit:
      sections:
        - kind: group
          label: Invoice
          rows:
            - [number, invoice_date]
            - [status, currency]
            - [customer, total]
            - [posted_at, version]
            - [posted_by]
        - kind: collection
          label: Lines
          collection: lines
          columns:
            - line_number
            - product
            - description
            - quantity
            - unit_price
            - total
    catalog.Product.edit:
      sections:
        - kind: group
          label: Product
          rows:
            - [code, unit_price]
            - [name, active]
  reports:
    - name: sales.invoice
      title: Invoice
      kind: record
      entity: sales.Invoice
    - name: sales.summary
      title: Posted Sales Summary
      kind: summary
      entity: sales.Invoice

capabilities:
  - id: capability_filtered_navigation
    tier: parity
    description: Shared navigation order and labels are filtered by current capabilities.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_workspace_switches_to_customer_management
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.test.tsx
            selector: connects through the safe manifest and renders capability navigation
            runner: web

  - id: opaque_cursor_continuation
    tier: parity
    description: Browse and record navigation append bounded opaque-cursor batches.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_browse_incrementally_loads_on_scroll
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.detail.test.tsx
            selector: opens a shared-layout detail and navigates without replacing the shell
            runner: web

  - id: shared_form_layout
    tier: parity
    description: Form rows, groups, collections, order, and labels come from one compiled contract.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_form_renders_portable_tabs_and_action_bar_order
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.detail.test.tsx
            selector: opens a shared-layout detail and navigates without replacing the shell
            runner: web

  - id: workflow_field_state
    tier: parity
    description: Current server-owned workflow state visibly locks fields and prevents mutation offers.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_posted_invoice_is_readonly
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.detail.test.tsx
            selector: opens a shared-layout detail and navigates without replacing the shell
            runner: web

  - id: flat_scalar_create_update
    tier: parity
    description: Customer and Product scalar forms use metadata defaults, masks, validation, and secured mutations.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_workspace_switches_to_customer_management
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.edit.test.tsx
            selector: creates and updates a flat metadata form through the secured API
            runner: web

  - id: exact_formatting_and_alignment
    tier: parity
    description: Exact decimals and dates share formatting metadata; numeric columns align right.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_edit_saves_header_and_line_transactionally
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/lib/format.test.ts
            selector: formats exact decimal source text without binary float conversion
            runner: web
          - path: web/src/App.detail.test.tsx
            selector: opens a shared-layout detail and navigates without replacing the shell
            runner: web

  - id: keyboard_form_and_record_navigation
    tier: parity
    description: Keyboard traversal and record navigation invoke the same guarded actions as buttons.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_form_focuses_columns_and_enter_advances
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.edit.test.tsx
            selector: creates and updates a flat metadata form through the secured API
            runner: web
          - path: web/src/App.detail.test.tsx
            selector: opens a shared-layout detail and navigates without replacing the shell
            runner: web

  - id: browse_grid_keyboard_traversal
    tier: parity
    description: The browse grid is one tab stop, arrow keys move the selection within it, and Enter opens the selected record.
    renderers:
      tui:
        status: covered
        note: Textual's DataTable owns the focus ring and the arrow keys; the test drives the browse from the keyboard alone.
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_edit_saves_header_and_line_transactionally
            runner: python
      web:
        status: covered
        note: A roving tabindex, added 2026-08-12. Before it every rendered row carried tabIndex 0 and no key moved between them.
        evidence:
          - path: web/src/App.grid-keyboard.test.tsx
            selector: gives the grid one tab stop and moves it with the arrow keys
            runner: web
          - path: web/src/App.grid-keyboard.test.tsx
            selector: moves the tab stop to the row a click selected
            runner: web
          - path: web/tests/e2e/journeys.spec.ts
            selector: browses and opens a record without touching the mouse
            runner: web

  - id: personal_column_layout
    tier: roadmap
    description: Personal resize/order state remains separate from application YAML defaults.
    renderers:
      tui:
        status: not_applicable
        note: Terminal columns use application metadata and responsive terminal sizing; direct drag resizing is not a TUI interaction.
      web:
        status: covered
        evidence:
          - path: web/src/lib/layout-preferences.test.ts
            selector: reconciles stored field names without changing application metadata
            runner: web

  - id: lookup_and_save_select
    tier: roadmap
    description: Multi-column reference lookup may create a missing target and select it without losing the parent draft.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_lookup_creates_product_and_preserves_invoice_draft
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.lookup.test.tsx
            selector: searches a metadata lookup and creates a related record with Save & Select
            runner: web

  - id: master_detail_collection_draft
    tier: roadmap
    description: Invoice and line edits remain one local draft and one authoritative parent transaction.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_edit_saves_header_and_line_transactionally
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.lookup.test.tsx
            selector: saves Invoice line drafts and Product Save & Select as one parent update
            runner: web

  - id: stale_conflict_review
    tier: roadmap
    description: Stale drafts require explicit Original/Current/Draft review and a fresh ETag.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_stale_edit_rebases_only_non_conflicting_draft_fields
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.edit.test.tsx
            selector: reviews a stale draft and rebases explicit choices onto the fresh ETag
            runner: web

  - id: domain_actions
    tier: roadmap
    description: Metadata actions reuse service authorization, ETags, idempotency, validation, and audit.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_post_uses_registered_action_and_audit
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.lookup.test.tsx
            selector: saves a dirty Invoice before posting it through the domain action
            runner: web

  - id: report_preview_and_export
    tier: roadmap
    description: Renderers preview the same server-built report document and controlled exports.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_report_preview_and_exports
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.lookup.test.tsx
            selector: previews secured record and summary reports and downloads controlled exports
            runner: web
          - path: tests/test_api_server.py
            selector: test_server_builds_only_authorized_renderer_neutral_reports
            runner: python

  - id: report_parameters
    tier: roadmap
    description: Renderers collect summary parameters as strings the report service types once, and an unsupplied optional parameter drops its criteria clause.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_invoice_report_preview_and_exports
            runner: python
          - path: tests/test_api_remote.py
            selector: test_remote_textual_preview_uses_the_server_report_document
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.lookup.test.tsx
            selector: sends collected summary parameters with builds and exports
            runner: web
          - path: tests/test_api_server.py
            selector: test_manifest_offers_required_parameter_summaries_with_their_metadata
            runner: python

  - id: browse_summaries
    tier: roadmap
    description: A browse view's declared summaries are requested with each page query and answered for the whole filtered set, drawn as a terminal bar and a browser footer band under their columns.
    renderers:
      tui:
        status: covered
        evidence:
          - path: tests/test_tui.py
            selector: test_textual_browse_summary_bar_answers_for_the_whole_set
            runner: python
          - path: tests/test_api_remote.py
            selector: test_remote_facades_browse_create_edit_lookup_and_post_via_http
            runner: python
      web:
        status: covered
        evidence:
          - path: web/src/App.summaries.test.tsx
            selector: asks for the declared summaries and lays the answers under their columns
            runner: web
          - path: tests/test_api_server.py
            selector: test_manifest_summaries_are_filtered_with_their_columns
            runner: python
