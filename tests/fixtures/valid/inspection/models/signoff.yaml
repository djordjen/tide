entity: inspect.Signoff
label: Signoffs
display: signed_by

permissions:
  list: inspect.read
  read: inspect.read
  create: inspect.write
  update: inspect.write

fields:
  id:        {type: integer, primary_key: true}
  signed_by: {type: string, length: 80, required: true}

  # Restricts deletion of the step it points at. A signed step must survive,
  # including when the step is removed from its inspection as an orphan.
  step:
    type: reference
    target: inspect.Step
    storage: step_id
    required: true
    on_delete: restrict
