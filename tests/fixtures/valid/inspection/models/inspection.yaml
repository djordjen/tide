entity: inspect.Inspection
label: Inspections
display: reference

permissions:
  list: inspect.read
  read: inspect.read
  create: inspect.write
  update: inspect.write
  delete: inspect.write

fields:
  id:        {type: integer, primary_key: true}
  reference: {type: string, length: 40, required: true}
  version:
    type: integer
    required: true
    default: 1
    readonly: true
    write: system
    concurrency_token: true

  steps:
    type: collection
    target: inspect.Step
    inverse: inspection
    order_by: position
    cascade: [create, update]
    orphan_delete: true
