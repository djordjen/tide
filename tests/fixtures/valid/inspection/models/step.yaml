entity: inspect.Step
label: Steps
display: title

permissions:
  list: inspect.read
  read: inspect.read
  create: inspect.write
  update: inspect.write

fields:
  id:    {type: integer, primary_key: true}
  title: {type: string, length: 80, required: true}

  # Written by the framework, never by a caller: the nested-write path has to
  # refuse a client-supplied value the same way it does on a root record.
  position:
    type: integer
    readonly: true
    write: system

  # Guarded by a field policy, so a caller may edit the step without being
  # allowed to edit this one field.
  note: {type: string, length: 200}

  inspection:
    type: reference
    target: inspect.Inspection
    storage: inspection_id
    inverse: steps
    required: true
    on_delete: cascade

  # A collection owned by a child, so removing the step has to reach its own
  # children rather than leaving them behind.
  readings:
    type: collection
    target: inspect.Reading
    inverse: step
    order_by: label
    cascade: [create, update]
    orphan_delete: true
