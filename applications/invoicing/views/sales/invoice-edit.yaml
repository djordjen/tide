# TIDE application metadata.
view: sales.Invoice.edit
base: generated.edit
mode: overlay
extends: standard_form

settings:
  compact_groups: true

layout:
  - group: Invoice
    rows:
      - [number, invoice_date, status, currency]
      - [customer]

  - collection: lines
    view: sales.InvoiceLine.inline_edit
    actions: [add, apply, remove]

  - group: Totals
    align: right
    rows:
      - [total]

  - group: Posting
    rows:
      - [posted_at, version, posted_by, signed_document]

  # Empty until the void action fills it, like Posting before a post:
  # the who, when and why of a cancellation belong on the record, not
  # only in its history tab.
  - group: Cancellation
    rows:
      - [cancelled_at, cancelled_by, cancelled_reason]

fields:
  customer:
    editor: lookup
    lookup_view: crm.Customer.lookup
    allow_create: true
    create_view: crm.Customer.edit

actions: [cancel, save, post, void]

surfaces:
  tui:
    minimum_width: 100
    collection_height: 14
