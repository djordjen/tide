# TIDE application metadata.
view: catalog.Product.browse
entity: catalog.Product
kind: browse
mode: overlay
extends: standard_browse

# Flat reference data is what editing in the row is for; invoices keep
# the form, where their lines live.
settings: {edit: inline}

columns: [code, name, unit_price, active]
search: [code, name]

fields:
  code: {width: 14}
  name: {width: 36}
  unit_price: {width: 14}
