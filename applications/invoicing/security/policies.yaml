# TIDE application metadata.
permissions:
  - crm.customer.read
  - crm.customer.write
  - crm.customer.delete
  - crm.customer.audit
  - catalog.product.read
  - catalog.product.write
  - catalog.product.delete
  - catalog.product.audit
  - sales.invoice.read
  - sales.invoice.write
  - sales.invoice.post
  - sales.invoice.void
  - sales.invoice.report
  - sales.invoice.audit
  - sales.invoice.detail

  # Reserved by the framework rather than defined here, and checked by TIDE.
  # The first permits administering the identities TIDE owns. The second
  # permits taking a browse view away as a file -- which is not a secret the
  # grid was keeping, since paging reaches the same rows, but is the
  # difference between reading here and carrying off.
  - tide.users.administer
  - tide.records.export

roles:
  sales_clerk:
    grants:
      - crm.customer.read
      - crm.customer.write
      - crm.customer.delete
      - catalog.product.read
      - catalog.product.write
      - catalog.product.delete
      - sales.invoice.read
      - sales.invoice.write
      - sales.invoice.post
      - sales.invoice.void
      - sales.invoice.report
      - sales.invoice.detail
      - tide.records.export

  auditor:
    grants:
      - crm.customer.read
      - crm.customer.audit
      - catalog.product.read
      - catalog.product.audit
      - sales.invoice.read
      - sales.invoice.report
      - sales.invoice.audit
      - sales.invoice.detail

  summary_viewer:
    grants:
      - sales.invoice.read

  # Deliberately grants nothing about invoices. Administering who may
  # sign in is not a reason to be able to sell anything.
  administrator:
    grants:
      - tide.users.administer

  invoice_poster:
    grants:
      - sales.invoice.read
      - sales.invoice.post
      - sales.invoice.detail

row_policies:
  - id: active_customers
    entity: crm.Customer
    operations: [list, read]
    criteria: "active == true"

  # Products deliberately carry no such policy: eligibility for NEW lines is
  # the lookup_filter on sales.InvoiceLine.product, so a retired product
  # stays visible in its own browse (and reactivatable) while no new line
  # can pick it. The customer policy above stays as the row-policy showcase.

field_policies:
  - entity: sales.Invoice
    field: lines
    read: sales.invoice.detail

  - entity: sales.Invoice
    field: posted_by
    read: sales.invoice.audit
    write: sales.invoice.post
