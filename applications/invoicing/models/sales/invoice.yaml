# TIDE application metadata.
entity: sales.Invoice
label: Invoices
display: number

expose:
  tui: true
  rest: {path: invoices, operations: [list, get, create, update]}
  mcp:
    resources: [schema, record, audit]
    tools: [search, create, update]

permissions:
  list: sales.invoice.read
  read: sales.invoice.read
  create: sales.invoice.write
  update: sales.invoice.write
  audit: sales.invoice.audit

fields:
  id:           {type: integer, primary_key: true, audit: none}
  number:
    type: string
    length: 30
    required: true
    unique: true
    readonly: true
    write: system
    generated_by: actions.allocate_invoice_number
    audit: values

  invoice_date:
    type: date
    required: true
    default_factory: today
    format: local_date
    audit: values

  currency:
    type: string
    length: 3
    required: true
    default: EUR
    audit: values

  status:
    type: choice
    choices: [draft, posted, cancelled]
    default: draft
    readonly: true
    write: action_only
    audit: values

  posted_at:
    type: datetime
    readonly: true
    write: action_only
    audit: values

  posted_by:
    type: string
    length: 120
    readonly: true
    write: action_only
    audit: values

  cancelled_at:
    type: datetime
    readonly: true
    write: action_only
    audit: values

  cancelled_by:
    type: string
    length: 120
    readonly: true
    write: action_only
    audit: values

  version:
    type: integer
    required: true
    default: 1
    readonly: true
    write: system
    concurrency_token: true
    audit: none

  customer:
    type: reference
    target: crm.Customer
    storage: customer_id
    inverse: invoices
    required: true
    on_delete: restrict
    audit: values

  lines:
    type: collection
    target: sales.InvoiceLine
    inverse: invoice
    order_by: line_number
    cascade: [create, update]
    orphan_delete: true

  total:
    type: decimal
    precision: 12
    scale: 2
    format: money
    readonly: true
    computed:
      expression: "sum(lines.total)"
      materialization: stored
    audit: values

validations:
  - id: invoice_has_lines
    when: "status == 'posted'"
    assert: "count(lines) > 0"
    message: A posted invoice must contain at least one line.
    run: [before_commit]

actions:
  post:
    label: Post invoice
    shortcut: Ctrl+P
    # The state half of this guard is derived from the transition below; only
    # the business half is written here.
    enabled_when: "count(lines) > 0"
    permission: sales.invoice.post
    execute: actions.post_invoice
    expose: {rest: true, mcp: true}
    idempotent: true
    transition:
      field: status
      from: draft
      to: posted
      locks_record: true
      stamp: {posted_at: now, posted_by: principal}

  # Not named `cancel`: that is the form action bar's built-in discard, and a
  # domain action sharing the name never reaches a form. TIDE276 refuses it.
  void:
    label: Void invoice
    permission: sales.invoice.void
    execute: actions.void_invoice
    expose: {rest: true, mcp: true}
    idempotent: true
    transition:
      field: status
      from: draft
      to: cancelled
      locks_record: true
      stamp: {cancelled_at: now, cancelled_by: principal}
