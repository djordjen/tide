entity: crm.Company
label: Companies
display: '{code} - {name}'
expose:
  tui: true
  rest:
    operations:
    - list
    - get
    - create
    - update
    - delete
  mcp:
    resources:
    - schema
    - record
    - audit
    tools:
    - search
    - create
    - update
    - delete
permissions:
  list: crm.company.read
  read: crm.company.read
  create: crm.company.write
  update: crm.company.write
  delete: crm.company.delete
  audit: crm.company.audit
fields:
  id:
    type: integer
    primary_key: true
  code:
    type: string
    length: 20
    required: true
    unique: true
  name:
    type: string
    length: 120
    required: true
  website:
    type: string
    length: 200
  active:
    type: boolean
    default: true
